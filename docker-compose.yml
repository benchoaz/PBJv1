services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pbj-network

  dpa-parser:
    build:
      context: ./dpa-parser
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - paddlex-cache:/root/.paddlex
    networks:
      - pbj-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=host=db port=5432 user=postgres password=postgres dbname=pbj_db sslmode=disable
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - PORT=8081
      - DPA_PARSER_URL=http://dpa-parser:8000
    depends_on:
      - scraper
      - db
      - dpa-parser
    restart: unless-stopped
    networks:
      - pbj-network

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pbj_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pbj-network

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=pbj_db
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/sirup-data
      - SCRAPE_INTERVAL=3600000
    depends_on:
      - n8n
      - db
    restart: unless-stopped
    networks:
      - pbj-network

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password123
      - N8N_ENCRYPTION_KEY=your-encryption-key-change-in-production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
    restart: unless-stopped
    networks:
      - pbj-network

  survey-service:
    build:
      context: ./survey-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    volumes:
      - ./frontend/public/screenshots:/app/screenshots
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - pbj-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - pbj-network

networks:
  pbj-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  paddlex-cache:
  pgdata: