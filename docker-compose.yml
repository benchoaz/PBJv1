services:
  frontend:
    image: localhost/pbj-frontend:v2
    build:
      context: ./frontend
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - VITE_API_URL=http://localhost:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

  dpa-parser:
    build:
      context: ./dpa-parser
      dockerfile: Dockerfile
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - paddlex-cache:/root/.paddlex
      - ./dpa-parser/main.py:/app/main.py

  api:
    image: alpine:latest
    working_dir: /root/
    command: ["./main"]
    network_mode: "host"
    environment:
      - DATABASE_URL=host=127.0.0.1 port=5432 user=postgres password=postgres dbname=pbj_db sslmode=disable
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - PORT=8081
      - DPA_PARSER_URL=http://127.0.0.1:8000
    volumes:
      - ./backend/main:/root/main
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17-alpine
    network_mode: "host"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pbj_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=pbj_db
      - N8N_WEBHOOK_URL=http://127.0.0.1:5678/webhook/sirup-data
      - SCRAPE_INTERVAL=3600000
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    network_mode: "host"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password123
      - N8N_ENCRYPTION_KEY=your-encryption-key-change-in-production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=127.0.0.1
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
    restart: unless-stopped

  survey-service:
    build:
      context: ./survey-service
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
    volumes:
      - ./frontend/public/screenshots:/app/screenshots
      - ./survey-service/server.js:/app/server.js
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: "host"
    restart: unless-stopped

volumes:
  paddlex-cache:
  pgdata:
