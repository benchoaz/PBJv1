<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="45 45 110 110">
<style>
/*
  8-second loop, 6 staggered swaps:
  Swap1 t=0.6s  → slots 0↔3  (A flips 0.6-1.0s, B flips 0.75-1.15s)
  Swap2 t=1.9s  → slots 1↔2  (A flips 1.9-2.3s,  B flips 2.05-2.45s)
  Swap3 t=3.1s  → slots 0↔1  (A flips 3.1-3.5s,  B flips 3.25-3.65s)
  Swap4 t=4.4s  → slots 2↔3  (A flips 4.4-4.8s,  B flips 4.55-4.95s)
  Swap5 t=5.6s  → slots 1↔3  (A flips 5.6-6.0s,  B flips 5.75-6.15s)
  Swap6 t=6.9s  → slots 0↔2  (A flips 6.9-7.3s,  B flips 7.05-7.45s)

  Tile state per slot (letter / bg color):
  Slot0: P/red  → ∅/green → J/yellow → P/red   (changes at 0.8s, 3.3s, 7.1s)
  Slot1: B/blue → J/yel   → ∅/green  → B/blue  (changes at 2.1s, 3.45s, 5.8s)
  Slot2: J/yel  → B/blue  → P/red    → J/yel   (changes at 2.25s, 4.6s, 7.25s)
  Slot3: ∅/green→ P/red   → B/blue   → ∅/green (changes at 0.95s, 4.75s, 5.95s)
*/

.tile { transform-origin: 0 0; }

/* ── SLOT 0 flip ── midpoints: 0.8s(10%), 3.3s(41.25%), 7.1s(88.75%) */
@keyframes s0f {
  0%,7.5%   { transform: scaleX(1); }
  10%        { transform: scaleX(0); }
  12.5%      { transform: scaleX(1); }
  38.75%     { transform: scaleX(1); }
  41.25%     { transform: scaleX(0); }
  43.75%,86.25% { transform: scaleX(1); }
  88.75%     { transform: scaleX(0); }
  91.25%,100%{ transform: scaleX(1); }
}
/* ── SLOT 1 flip ── midpoints: 2.1s(26.25%), 3.45s(43.125%), 5.8s(72.5%) */
@keyframes s1f {
  0%,23.75%  { transform: scaleX(1); }
  26.25%     { transform: scaleX(0); }
  28.75%     { transform: scaleX(1); }
  40.625%    { transform: scaleX(1); }
  43.125%    { transform: scaleX(0); }
  45.625%,70%{ transform: scaleX(1); }
  72.5%      { transform: scaleX(0); }
  75%,100%   { transform: scaleX(1); }
}
/* ── SLOT 2 flip ── midpoints: 2.25s(28.125%), 4.6s(57.5%), 7.25s(90.625%) */
@keyframes s2f {
  0%,25.625% { transform: scaleX(1); }
  28.125%    { transform: scaleX(0); }
  30.625%    { transform: scaleX(1); }
  55%        { transform: scaleX(1); }
  57.5%      { transform: scaleX(0); }
  60%,88.125%{ transform: scaleX(1); }
  90.625%    { transform: scaleX(0); }
  93.125%,100%{ transform: scaleX(1); }
}
/* ── SLOT 3 flip ── midpoints: 0.95s(11.875%), 4.75s(59.375%), 5.95s(74.375%) */
@keyframes s3f {
  0%,9.375%  { transform: scaleX(1); }
  11.875%    { transform: scaleX(0); }
  14.375%    { transform: scaleX(1); }
  56.875%    { transform: scaleX(1); }
  59.375%    { transform: scaleX(0); }
  61.875%,71.875%{ transform: scaleX(1); }
  74.375%    { transform: scaleX(0); }
  76.875%,100%{ transform: scaleX(1); }
}

/* ── Background color per slot (discrete jumps) ── */
@keyframes s0c {
  0%,9.99%   { fill:#E53935; }
  10%,41.24% { fill:#43A047; }
  41.25%,88.74%{ fill:#FDD835; }
  88.75%,100%{ fill:#E53935; }
}
@keyframes s1c {
  0%,26.24%  { fill:#1E88E5; }
  26.25%,43.12%{ fill:#FDD835; }
  43.13%,72.49%{ fill:#43A047; }
  72.5%,100% { fill:#1E88E5; }
}
@keyframes s2c {
  0%,28.12%  { fill:#FDD835; }
  28.13%,57.49%{ fill:#1E88E5; }
  57.5%,90.62%{ fill:#E53935; }
  90.63%,100%{ fill:#FDD835; }
}
@keyframes s3c {
  0%,11.87%  { fill:#43A047; }
  11.88%,59.37%{ fill:#E53935; }
  59.38%,74.37%{ fill:#1E88E5; }
  74.38%,100%{ fill:#43A047; }
}

/* ── Letter opacity per slot ── */
/* Slot0-P: visible 0→10%, 88.75→100% */
@keyframes s0P { 0%,9.99%{opacity:1} 10%,88.74%{opacity:0} 88.75%,100%{opacity:1} }
/* Slot0-J: visible 41.25→88.75% */
@keyframes s0J { 0%,41.24%{opacity:0} 41.25%,88.74%{opacity:1} 88.75%,100%{opacity:0} }

/* Slot1-B: visible 0→26.25%, 72.5→100% */
@keyframes s1B { 0%,26.24%{opacity:1} 26.25%,72.49%{opacity:0} 72.5%,100%{opacity:1} }
/* Slot1-J: visible 26.25→43.13% */
@keyframes s1J { 0%,26.24%{opacity:0} 26.25%,43.12%{opacity:1} 43.13%,100%{opacity:0} }

/* Slot2-J: visible 0→28.13%, 90.63→100% */
@keyframes s2J { 0%,28.12%{opacity:1} 28.13%,90.62%{opacity:0} 90.63%,100%{opacity:1} }
/* Slot2-B: visible 28.13→57.5% */
@keyframes s2B { 0%,28.12%{opacity:0} 28.13%,57.49%{opacity:1} 57.5%,100%{opacity:0} }
/* Slot2-P: visible 57.5→90.63% */
@keyframes s2P { 0%,57.49%{opacity:0} 57.5%,90.62%{opacity:1} 90.63%,100%{opacity:0} }

/* Slot3-P: visible 11.88→59.38% */
@keyframes s3P { 0%,11.87%{opacity:0} 11.88%,59.37%{opacity:1} 59.38%,100%{opacity:0} }
/* Slot3-B: visible 59.38→74.38% */
@keyframes s3B { 0%,59.37%{opacity:0} 59.38%,74.37%{opacity:1} 74.38%,100%{opacity:0} }

.s0  { animation: s0f 8s linear infinite; }
.s1  { animation: s1f 8s linear infinite; }
.s2  { animation: s2f 8s linear infinite; }
.s3  { animation: s3f 8s linear infinite; }

.s0c { animation: s0c 8s linear infinite; }
.s1c { animation: s1c 8s linear infinite; }
.s2c { animation: s2c 8s linear infinite; }
.s3c { animation: s3c 8s linear infinite; }

.s0P { animation: s0P 8s step-start infinite; }
.s0J { animation: s0J 8s step-start infinite; opacity:0; }
.s1B { animation: s1B 8s step-start infinite; }
.s1J { animation: s1J 8s step-start infinite; opacity:0; }
.s2J { animation: s2J 8s step-start infinite; }
.s2B { animation: s2B 8s step-start infinite; opacity:0; }
.s2P { animation: s2P 8s step-start infinite; opacity:0; }
.s3P { animation: s3P 8s step-start infinite; opacity:0; }
.s3B { animation: s3B 8s step-start infinite; opacity:0; }

text { font-family:'Segoe UI',system-ui,sans-serif; font-weight:900; font-size:24px; fill:rgba(0,0,0,0.5); text-anchor:middle; dominant-baseline:central; }
</style>

<!-- Removed background rect for transparent UI integration -->
<!-- Slot 0 — top-left, center (75,75) -->
<g transform="translate(75,75)">
  <g class="tile s0">
    <rect class="s0c" x="-22.5" y="-22.5" width="45" height="45" rx="8" fill="#E53935"/>
    <text class="s0P">P</text>
    <text class="s0J">J</text>
  </g>
</g>

<!-- Slot 1 — top-right, center (125,75) -->
<g transform="translate(125,75)">
  <g class="tile s1">
    <rect class="s1c" x="-22.5" y="-22.5" width="45" height="45" rx="8" fill="#1E88E5"/>
    <text class="s1B">B</text>
    <text class="s1J">J</text>
  </g>
</g>

<!-- Slot 2 — bottom-left, center (75,125) -->
<g transform="translate(75,125)">
  <g class="tile s2">
    <rect class="s2c" x="-22.5" y="-22.5" width="45" height="45" rx="8" fill="#FDD835"/>
    <text class="s2J">J</text>
    <text class="s2B">B</text>
    <text class="s2P">P</text>
  </g>
</g>

<!-- Slot 3 — bottom-right, center (125,125) -->
<g transform="translate(125,125)">
  <g class="tile s3">
    <rect class="s3c" x="-22.5" y="-22.5" width="45" height="45" rx="8" fill="#43A047"/>
    <text class="s3P">P</text>
    <text class="s3B">B</text>
  </g>
</g>

</svg>
