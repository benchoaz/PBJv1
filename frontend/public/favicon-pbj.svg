<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- P — merah, kiri atas -->
  <rect x="6"  y="6"  width="50" height="50" rx="10" fill="#E53935"/>
  <text x="31" y="31" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-weight="900" font-size="28" fill="rgba(0,0,0,0.45)">P</text>

  <!-- B — biru, kanan atas -->
  <rect x="64" y="6"  width="50" height="50" rx="10" fill="#1E88E5"/>
  <text x="89" y="31" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-weight="900" font-size="28" fill="rgba(0,0,0,0.45)">B</text>

  <!-- J — kuning, kiri bawah -->
  <rect x="6"  y="64" width="50" height="50" rx="10" fill="#FDD835"/>
  <text x="31" y="89" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-weight="900" font-size="28" fill="rgba(0,0,0,0.45)">J</text>

  <!-- kosong — hijau, kanan bawah -->
  <rect x="64" y="64" width="50" height="50" rx="10" fill="#2E7D32"/>
</svg>
